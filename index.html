<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Chamados TI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #aaa;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 16px;
        }

        #saida {
            margin-top: 25px;
            padding: 15px;
            background: #f5f5f5;
            white-space: pre-wrap;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Sistema de Chamados TI</h1>

    <label>Nome do Chamado</label>
    <input id="titulo">

    <label>O que houve</label>
    <textarea id="problema"></textarea>

    <label>Validação Inicial</label>
    <textarea id="validacaoInicial"></textarea>

    <label>Configuração/Execução</label>
    <textarea id="execucao"></textarea>

    <label>Validação</label>
    <textarea id="validacao"></textarea>

    <label>Resultado</label>
    <textarea id="resultado"></textarea>

    <button onclick="gerarChamado()">
        Gerar Chamado
    </button>

    <button onclick="copiarChamado()">
        Copiar Chamado
    </button>

    <div id="saida"></div>

</div>

<script>

function gerarChamado() {

    const titulo =
        document.getElementById("titulo").value;

    const problema =
        document.getElementById("problema").value;

    const validacaoInicial =
        document.getElementById("validacaoInicial").value;

    const execucao =
        document.getElementById("execucao").value;

    const validacao =
        document.getElementById("validacao").value;

    const resultado =
        document.getElementById("resultado").value;


    const chamado =
`NOME DO CHAMADO:
${titulo}

O QUE HOUVE:
${problema}

PROCEDIMENTO EXECUTADO

1. VALIDAÇÃO INICIAL
${validacaoInicial}

2. CONFIGURAÇÃO/EXECUÇÃO
${execucao}

3. VALIDAÇÃO
${validacao}

RESULTADO:
${resultado}`;


    document.getElementById("saida").innerText =
        chamado;
}


function copiarChamado() {

    const texto =
        document.getElementById("saida").innerText;

    if (!texto) {
        alert("Primeiro gere o chamado.");
        return;
    }

    navigator.clipboard.writeText(texto);

    alert("Chamado copiado!");
}

</script>

</body>
</html>
